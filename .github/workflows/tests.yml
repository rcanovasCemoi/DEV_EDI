name: Tests EDIFACT_BABELWAY

on:
  push:
    branches: [main]
    paths: ['EDIFACT_BABELWAY/**', '.github/workflows/tests.yml']
  pull_request:
    branches: [main]
    paths: ['EDIFACT_BABELWAY/**', '.github/workflows/tests.yml']
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EDIFACT_BABELWAY
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: EDIFACT_BABELWAY/package-lock.json

      - name: Installation des dépendances de test
        run: npm ci

      - name: Vérification syntaxe du script embarqué
        run: node --check tests/run-tests.js

      - name: Tests de non-régression (moteur EDIFACT, gap analysis, Master XML/EDI)
        run: npm test
